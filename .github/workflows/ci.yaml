name: Aviator Signals CI/CD Pipeline

on:
  push:
    branches: [prod]

jobs:
  run-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit and run linting
        run: |
          pip install pre-commit
          SKIP=ggshield pre-commit run --all-files

      - name: Build Docker images
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.override.yml up --build -d

      - name: Run tests in Docker container
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.override.yml run --rm app python manage.py test

      - name: Tear down Docker Compose services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.override.yml down


  build-and-push:
    runs-on: ubuntu-latest
    needs: run-test  # Only runs if tests pass
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx  # Faster & better caching
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker buildx build --push \
          -f docker/Dockerfile \
          --tag ghcr.io/${{ github.repository_owner }}/as-api:latest \
          --tag ghcr.io/${{ github.repository_owner }}/as-api:${{ github.sha }} \
          .

      - name: Confirm Image Pushed
        run: |
          echo "Image pushed to GHCR:"
          echo "  ghcr.io/${{ github.repository_owner }}/as-api:latest"
          echo "  ghcr.io/${{ github.repository_owner }}/as-api:${{ github.sha }}"
