name: Aviator Signals CI/CD Pipeline

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.10 (needed for running pre-commit)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install pre-commit and run the linting hooks defined in pre-commit-config.yaml
      - name: Install pre-commit and run linting
        run: |
          pip install pre-commit
          SKIP=ggshield pre-commit run --all-files

      # 4. Build your Docker images using docker-compose.
      #    This step uses your docker-compose file to build the app and related services.
      - name: Build Docker images
        run: docker compose -f ./docker/docker-compose.yaml up --build

      # 5. Run tests using docker-compose.
      #    Here we override the app container’s default command by running "pytest".
      #    Adjust this command if your tests are executed differently.
      - name: Run tests in Docker container
        run: docker-compose run --rm app python manage.py test

      # 6. Tear down docker-compose containers (runs regardless of test outcome)
      - name: Tear down Docker Compose services
        if: always()
        run: docker-compose down
