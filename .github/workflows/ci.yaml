name: Aviator Signals CI/CD Pipeline

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pre-commit and run linting
        run: |
          pip install pre-commit
          SKIP=ggshield pre-commit run --all-files

      - name: Build Docker images
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker/docker-compose.yml up --build

      - name: Run tests in Docker container
        run: docker-compose run --rm app python manage.py test

      - name: Tear down Docker Compose services
        if: always()
        run: docker-compose down
