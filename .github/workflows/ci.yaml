name: Aviator Signals CI/CD Pipeline

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pre-commit and run linting
        run: |
          pip install pre-commit
          SKIP=ggshield pre-commit run --all-files

      - name: Create docker-compose override for CI
        run: |
          cat <<EOF > docker-compose.override.yml
            version: "3.9"
            services:
            app:
                environment:
                POSTGRES_USER: "${{ secrets.POSTGRES_USER }}"
                POSTGRES_PASSWORD: "${{ secrets.POSTGRES_PASSWORD }}"
                POSTGRES_DB: "${{ secrets.POSTGRES_DB }}"
                POSTGRES_HOST: "host.docker.internal"
                SECRET_KEY: "${{ secrets.SECRET_KEY }}"
                DEBUG: 0
                REDIS_URL: "redis://redis:6379"
                KUBERNETES_TOKEN: ""
                KUBERNETES_API_BASE_URL: ""
                REBOOT_WORKERS: 1
                NEW_RELIC_LICENSE: ""
                LOGTAIL_TOKEN: ""
                LOGTAIL_HOST=""
                HOST_PINNACLE_USER_ID: ""
                HOST_PINNACLE_PASSWORD: ""
                HOST_PINNACLE_SENDER_ID: ""
                extra_hosts:
                - "host.docker.internal:host-gateway"
            celery_worker:
                extra_hosts:
                - "host.docker.internal:host-gateway"
            celery_beat:
                extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF

      - name: Build Docker images
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker/docker-compose.yml -f docker-compose.override.yml up --build -d

      - name: Run tests in Docker container
        run: docker compose -f docker/docker-compose.yml -f docker-compose.override.yml run --rm app python manage.py test

      - name: Tear down Docker Compose services
        if: "always()"
        run: docker compose -f docker/docker-compose.yml -f docker-compose.override.yml down
