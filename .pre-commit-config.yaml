exclude: >
  (.*migrations/.*)|(k8/workers/templates/.*\.ya?ml$)
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [
          "-d",
          "{extends: default, ignore: k8/, rules: {document-start: disable, braces: disable, line-length: {max: 120, level: warning}}}"  # yamllint disable-line
        ]

  # Prevent secrets from being committed
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.34.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]

  # Format code to PEP standards
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.10.15

  # Sort imports alphabetically and automatically separate into sections and by type
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black", "--filter-files"]

  # An extremely fast Python linter and code formatter to replace flake8
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.8.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
