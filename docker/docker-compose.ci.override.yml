version: "3.9"
services:
  app:
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST: "host.docker.internal"
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: 0
      REDIS_URL: "redis://host.docker.internal:6379"
      DATABASE_URL: ""
      KUBERNETES_TOKEN: ""
      KUBERNETES_API_BASE_URL: ""
      REBOOT_WORKERS: 1
      NEW_RELIC_LICENSE: ""
      LOGTAIL_TOKEN: ""
      LOGTAIL_HOST: ""
      HOST_PINNACLE_USER_ID: ""
      HOST_PINNACLE_PASSWORD: ""
      HOST_PINNACLE_SENDER_ID: ""
      ONESIGNAL_APP_ID: ""
      ONESIGNAL_API_KEY: ""
      AZURE_ACCOUNT_NAME: ""
      AZURE_ACCOUNT_KEY: ""
      AZURE_CONTAINER_STATIC: ""
      AZURE_CONTAINER_MEDIA: ""
      AZURE_CONNECTION_STRING: ""
      APP_VERSION: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
  celery_worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  celery_beat:
    extra_hosts:
      - "host.docker.internal:host-gateway"
