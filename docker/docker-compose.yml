version: "3.9"

services:

  app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    image: ghcr.io/waruingugi/as-api:latest
    networks:
      - aviator-backend-network
    container_name: aviator-container
    restart: always
    volumes:
      - .:/data
    ports:
      - "8000:8000"

  celery_worker:
    deploy:
      replicas: 3
    container_name: celery-worker
    image: ghcr.io/waruingugi/as-api:latest
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    networks:
      - aviator-backend-network
    command: celery -A aviator worker --loglevel=info
    volumes:
      - .:/data
    depends_on:
      - app

  celery_beat:
    container_name: celery-beat
    image: ghcr.io/waruingugi/as-api:latest
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    networks:
      - aviator-backend-network
    command: celery -A aviator beat --loglevel=info
    volumes:
      - .:/data
    depends_on:
      - app

volumes:
  db_data:

networks:
  aviator-backend-network:
    name: aviator-backend-network
