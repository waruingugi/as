# fly.toml app configuration file generated for as-api on 2025-01-10T20:41:55+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'as-api'
primary_region = 'jnb'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  DJANGO_SETTINGS_MODULE = 'aviator.settings'
  TZ = 'Africa/Nairobi'

[processes]
  app = ''

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256MB'
  cpu_kind = 'shared'

[[statics]]
  guest_path = '/app/static'
  url_prefix = '/static'
