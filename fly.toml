# fly.toml app configuration file generated for as-app-api on 2025-07-21T08:03:26+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aviator-signals-api'
primary_region = 'iad'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'docker/Dockerfile'

[env]
  DJANGO_SETTINGS_MODULE = 'aviator.settings'
  TZ = 'Africa/Nairobi'

[processes]
  app = ''
  celery_beat = 'celery -A aviator beat -l info'
  celery_worker = 'celery -A aviator worker -l info'


[[statics]]
  guest_path = "/home/api/staticfiles"
  url_prefix = "/static/"

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['app']

[[services.ports]]
  port = 80
  handlers = ['http']
  force_https = true

[[services.ports]]
  port = 443
  handlers = ['tls', 'http']

[services.concurrency]
  type = 'connections'
  hard_limit = 25
  soft_limit = 20

[[services.tcp_checks]]
  interval = '15s'
  timeout = '5s'
  grace_period = '5s'

[[vm]]
  size = 'shared-cpu-2x'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256MB'
  cpu_kind = 'shared'
  processes = ['celery_worker']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256MB'
  cpu_kind = 'shared'
  processes = ['celery_beat']

[[statics]]
  guest_path = '/app/static'
  url_prefix = '/static'
