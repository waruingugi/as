# config with disabled TLS (e.g. for Minikube)
# If you only want metrics, uncomment below and provide the token
vector:
  customConfig:
    transforms:
      better_stack_kubernetes_parser: ~  # Disable log transformation
    sinks:
      better_stack_http_sink: ~  # Remove log sink
      better_stack_http_metrics_sink:
        uri: ""
        auth:
          strategy: "bearer"
          token: "" # Use token provided by betterstacks
    sources:
      better_stack_kubernetes_logs: ~  # Disable logs source

      better_stack_kubernetes_metrics_nodes:
        tls:
          verify_certificate: false
          verify_hostname: false
      better_stack_kubernetes_metrics_pods:
        tls:
          verify_certificate: false
          verify_hostname: false

metrics-server:
  args:
    - --kubelet-insecure-tls