vector:
  customConfig:
    transforms:
      # Drop all logs from the default log parser
      better_stack_http_filter:
        type: "filter"
        inputs: ["better_stack_kubernetes_parser"]
        condition: "false"  # Always false, so it drops everything

    sinks:
      # Connect the log sink to the filter, which drops all logs
      better_stack_http_sink:
        uri: ""  # Add your Better Stack HTTP endpoint here
        inputs: ["better_stack_http_filter"]
        auth:
          strategy: "bearer"
          token: ""  # Use token provided by Better Stack

      # Keep metrics sink as-is
      better_stack_http_metrics_sink:
        uri: ""  # Add your Better Stack HTTP metrics endpoint here
        auth:
          strategy: "bearer"
          token: ""  # Use token provided by Better Stack

    sources:
      # Do NOT include better_stack_kubernetes_logs source
      # (implicitly disabled if unused in any pipeline)
      better_stack_kubernetes_metrics_nodes:
        tls:
          verify_certificate: false
          verify_hostname: false
      better_stack_kubernetes_metrics_pods:
        tls:
          verify_certificate: false
          verify_hostname: false

metrics-server:
  args:
    - --kubelet-insecure-tls
