        statefulset.kubernetes.io/pod-name: ${APP_NAME}-seed-1
      ports:
        - protocol: TCP
          port: 5900
          targetPort: 5900
      type: LoadBalancer

  - apiVersion: v1
    kind: Service
    metadata:
