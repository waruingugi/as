apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}-svc-0
      namespace: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}-pod
        statefulset.kubernetes.io/pod-name: ${APP_NAME}-seed-0
      ports:
        - protocol: TCP
          port: 5900
          targetPort: 5900
      type: LoadBalancer

  - apiVersion: v1
