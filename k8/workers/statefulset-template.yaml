apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${APP_NAME}-seed
  namespace: ${APP_NAME}
spec:
  replicas: 3
  serviceName: ${APP_NAME}-svc-service
  selector:
    matchLabels:
      app: ${APP_NAME}-pod
  template:
    metadata:
      labels:
        app: ${APP_NAME}-pod
    spec:
      imagePullSecrets:
      - name: github-docker-secret
      containers:
      - name: chrome-browser
        image: ghcr.io/waruingugi/chrome-browser:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5900
          name: vnc
        env:
        # Expose pod name as an environment variable
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Dynamically fetch environment variables from the Secret
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: chrome-secrets
              key: pod-${HOSTNAME##*-}-API_KEY
        - name: PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              name: chrome-secrets
              key: pod-${HOSTNAME##*-}-PHONE_NUMBER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: chrome-secrets
              key: pod-${HOSTNAME##*-}-PASSWORD
        - name: VNC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chrome-secrets
              key: VNC_PASSWORD
        resources:
          requests:
            memory: "512Mi"  # Minimum amount of memory requested per pod
            cpu: "500m"      # Minimum amount of CPU requested per pod
          limits:
            memory: "8Gi"    # Maximum amount of memory allowed per pod
            cpu: "8"         # Maximum amount of CPU allowed per pod
