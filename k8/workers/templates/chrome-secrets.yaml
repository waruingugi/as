apiVersion: v1
kind: Secret
metadata:
  name: chrome-secrets
  namespace: {{ .Values.namespace | default .Values.app | default .Release.Namespace }}
type: Opaque
data:
  pod-0-API_KEY: {{ .Values.secrets.pod0.API_KEY | default "" | b64enc }}
  pod-0-PHONE_NUMBER: {{ .Values.secrets.pod0.PHONE_NUMBER | default "" | b64enc }}
  pod-0-PASSWORD: {{ .Values.secrets.pod0.PASSWORD | default "" | b64enc }}
  pod-1-API_KEY: {{ .Values.secrets.pod1.API_KEY | default "" | b64enc }}
  pod-1-PHONE_NUMBER: {{ .Values.secrets.pod1.PHONE_NUMBER | default "" | b64enc }}
  pod-1-PASSWORD: {{ .Values.secrets.pod1.PASSWORD | default "" | b64enc }}
  pod-2-API_KEY: {{ .Values.secrets.pod2.API_KEY | default "" | b64enc }}
  pod-2-PHONE_NUMBER: {{ .Values.secrets.pod2.PHONE_NUMBER | default "" | b64enc }}
  pod-2-PASSWORD: {{ .Values.secrets.pod2.PASSWORD | default "" | b64enc }}
  VNC_PASSWORD: {{ .Values.secrets.VNC_PASSWORD | default "" | b64enc }}
  BASE_URL: {{ .Values.secrets.BASE_URL | default "" | b64enc }}
